# Workshop metadata. Only this file is read by the validator and the index; the README stays plain Markdown.
title: Workshop Title
language: en
authors:                       # a plain name, or name + one profile link
  - name: Your Name
    url: https://github.com/yourhandle
translators: []                # translations only: who translated this file
maintainers: [Your Name]
level: beginner                # beginner | intermediate | advanced
duration: 90 minutes
prerequisites: []              # slugs of workshops to complete first, e.g. [getting-started]
track: fundamentals            # optional: groups workshops into a learning path
# order: 1                      # optional: position within its level in the index (lower first)
last_updated: 2026-01-01
tested_with:                   # optional: any tool → version this was last verified against
  avalanche-cli: 1.8.0
  solidity: 0.8.28
  foundry: 1.0.0
# translated_from: en@2026-01-01  # translations only: source language @ the last_updated date of the file you translated
links:                         # optional: any key → URL; slides, code, recordings, blog posts live outside this repo
  slides: https://example.com/slides
  code: https://github.com/example/repo
  video: https://example.com/video
  blog: https://example.com/post

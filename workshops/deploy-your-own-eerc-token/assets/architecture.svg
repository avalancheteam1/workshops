<svg xmlns="http://www.w3.org/2000/svg" width="640" height="215" viewBox="0 0 640 215" font-family="system-ui, sans-serif" font-size="14" role="img" aria-labelledby="t d">
  <title id="t">Three layers of an eERC deployment</title>
  <desc id="d">Your machine holds the key and creates proofs. It sends a proof to the EncryptedERC and Registrar contracts, which store encrypted balances and public keys and call verifyProof on the Groth16 verifier contracts.</desc>
  <rect width="640" height="215" rx="8" fill="#ffffff"/>
  <text x="202" y="62" text-anchor="middle" fill="#333" font-size="12">proof</text>
  <text x="437" y="62" text-anchor="middle" fill="#333" font-size="12">verifyProof</text>
  <rect x="15" y="72" width="140" height="82" rx="8" fill="#fff" stroke="#e84142" stroke-width="2"/>
  <text x="85" y="100" text-anchor="middle" font-weight="bold">Your machine</text>
  <text x="85" y="120" text-anchor="middle" fill="#555" font-size="12">secret key</text>
  <text x="85" y="138" text-anchor="middle" fill="#555" font-size="12">creates proofs</text>
  <rect x="250" y="72" width="140" height="82" rx="8" fill="#fff" stroke="#e84142" stroke-width="2"/>
  <text x="320" y="100" text-anchor="middle" font-weight="bold">Token + Registrar</text>
  <text x="320" y="120" text-anchor="middle" fill="#555" font-size="12">encrypted balances</text>
  <text x="320" y="138" text-anchor="middle" fill="#555" font-size="12">public keys, rules</text>
  <rect x="485" y="72" width="140" height="82" rx="8" fill="#fff" stroke="#e84142" stroke-width="2"/>
  <text x="555" y="100" text-anchor="middle" font-weight="bold">Verifiers</text>
  <text x="555" y="120" text-anchor="middle" fill="#555" font-size="12">Groth16</text>
  <text x="555" y="138" text-anchor="middle" fill="#555" font-size="12">true or false</text>
  <line x1="167" y1="113" x2="238" y2="113" stroke="#333" stroke-width="2" marker-end="url(#a)"/>
  <line x1="402" y1="113" x2="473" y2="113" stroke="#333" stroke-width="2" marker-end="url(#a)"/>
  <defs><marker id="a" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#333"/></marker></defs>
  <text x="320" y="184" text-anchor="middle" fill="#555" font-size="12">The secret key never leaves your machine. The chain stores ciphertexts and checks proofs.</text>
  <text x="320" y="202" text-anchor="middle" fill="#555" font-size="12">No contract can read a balance.</text>
</svg>

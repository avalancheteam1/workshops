name: Staleness check

on:
  schedule:
    - cron: "0 6 * * 1"   # Mondays 06:00 UTC
  workflow_dispatch:

concurrency:
  group: readme-index   # index and staleness both push README.md; never at the same time
  cancel-in-progress: false

permissions:
  contents: write
  issues: write

jobs:
  staleness:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - run: pip install pyyaml
      - run: gh label create "translation wanted" --color 0E8A16 --force
      - run: python3 scripts/check_staleness.py --github
      - name: Rebuild index so status icons reflect today
        run: |
          python3 scripts/build_index.py
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add README.md
          if git diff --cached --quiet; then echo "README.md unchanged"; exit 0; fi
          git commit -m "chore: rebuild workshop index"
          git pull --rebase origin main
          git push

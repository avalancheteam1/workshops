name: Fuji MCP pilot
on:
  pull_request:
    paths: ['workshops/fuji-ai-editor/**', '.github/workflows/fuji-pilot.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  pilot:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: workshops/fuji-ai-editor/assets/pilot
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '26.8.1'
      - run: npm install --global pnpm@11.24.0
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - run: pnpm test
      # The hosted image already supplies Chrome and its system libraries.
      - run: google-chrome --version
      - uses: foundry-rs/foundry-toolchain@dba66c27052e63476d886f22216e119ba7e615bf # v1
        with:
          version: v1.5.1
      - run: pnpm test:e2e
        env:
          CHROME_PATH: /usr/bin/google-chrome
      - run: pnpm exec mcpb validate manifest.json
      - run: pnpm bundle
      - run: pnpm audit --prod --audit-level=moderate

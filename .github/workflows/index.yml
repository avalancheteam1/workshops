name: Build index

on:
  push:
    branches: [main]
    paths: [workshops/**, scripts/**]
  workflow_dispatch:

concurrency:
  group: readme-index   # index and staleness both push README.md; never at the same time
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  index:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - run: pip install pyyaml
      - run: python3 scripts/build_index.py
      - name: Commit README.md if changed
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add README.md
          if git diff --cached --quiet; then echo "README.md unchanged"; exit 0; fi
          git commit -m "chore: rebuild workshop index"
          git pull --rebase origin main
          git push

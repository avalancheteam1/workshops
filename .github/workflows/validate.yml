name: Validate workshops

on:
  pull_request:
  push:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - run: pip install pyyaml
      - run: python3 test_scripts.py
        working-directory: scripts
      - run: python3 scripts/validate.py
      - name: README.md is generated - must not be edited in a PR
        if: github.event_name == 'pull_request'
        run: |
          if ! git diff --quiet origin/${{ github.base_ref }}...HEAD -- README.md; then
            echo "::error file=README.md::README.md is generated by scripts/build_index.py and rebuilt on push to main. Revert your changes to it; edit the INTRO in scripts/build_index.py instead."
            exit 1
          fi
